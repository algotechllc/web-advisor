<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Advisor options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Web Advisor options</h1>
      <form id="form">
        <label>
          API base URL
          <input id="apiBaseUrl" name="apiBaseUrl" type="url" required placeholder="http://localhost:3000" />
        </label>
        <label>
          Site base URL (report links)
          <input id="siteBaseUrl" name="siteBaseUrl" type="url" required placeholder="http://localhost:3000" />
        </label>
        <label>
          Notify when grade is at or below
          <select id="notifyThreshold" name="notifyThreshold">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C" selected>C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
          </select>
        </label>
        <button type="submit">Save</button>
        <p id="status" class="status" hidden>Saved.</p>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
